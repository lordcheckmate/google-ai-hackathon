<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#000000; font-family: monospace;">
  <defs>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="neonBlur">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Technical Grid Background -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181b" stroke-width="0.8"/>
  </pattern>
  <rect width="960" height="480" fill="url(#grid)"/>

  <!-- Outer HUD Frame -->
  <rect x="20" y="20" width="920" height="440" rx="16" fill="none" stroke="#27272a" stroke-width="1.5"/>
  <rect x="25" y="25" width="910" height="430" rx="12" fill="none" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.4"/>

  <!-- Top Banner / Watermark -->
  <text x="50" y="60" fill="#06b6d4" font-size="14" font-weight="bold" letter-spacing="2">🍌 GOOGLE CLOUD NANO BANANA • VISUAL SCHEMATIC</text>
  <text x="50" y="80" fill="#71717a" font-size="11" letter-spacing="1">SUBJECT: GOOGLE CLOUD RUN & VERTEX AI MESH // PROMPT: "Can you visualize the system architecture for our "</text>
  <text x="760" y="60" fill="#10b981" font-size="11" font-weight="bold">LATENCY: 14.8ms • ACTIVE</text>

  <!-- Flow Connectors -->
  <path d="M 220 220 L 320 220" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4" filter="url(#neonBlur)"/>
  <path d="M 460 220 L 560 220" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4" filter="url(#neonBlur)"/>
  <path d="M 700 220 L 780 220" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4" filter="url(#neonBlur)"/>

  <!-- Stage 1 Node: Ingress -->
  <g transform="translate(80, 160)">
    <rect width="140" height="120" rx="10" fill="#090d16" stroke="#06b6d4" stroke-width="1.5" filter="url(#neonBlur)"/>
    <circle cx="25" cy="30" r="6" fill="#06b6d4"/>
    <text x="40" y="34" fill="#ffffff" font-size="13" font-weight="bold">INGRESS</text>
    <text x="20" y="65" fill="#a1a1aa" font-size="11">Web Audio API</text>
    <text x="20" y="85" fill="#06b6d4" font-size="10">16kHz Stereo</text>
    <text x="20" y="105" fill="#71717a" font-size="9">Sub-10ms Buffer</text>
  </g>

  <!-- Stage 2 Node: Nano Banana Pre-Filter -->
  <g transform="translate(320, 150)">
    <rect width="140" height="140" rx="10" fill="#130d04" stroke="#f59e0b" stroke-width="1.5" filter="url(#neonBlur)"/>
    <circle cx="25" cy="30" r="6" fill="#f59e0b"/>
    <text x="40" y="34" fill="#fef08a" font-size="12" font-weight="bold">NANO BANANA</text>
    <text x="20" y="65" fill="#fbbf24" font-size="11">Edge Vision &amp; Parse</text>
    <text x="20" y="85" fill="#a1a1aa" font-size="10">Temporal Slicing</text>
    <text x="20" y="105" fill="#f59e0b" font-size="10">4K Vector Mesh</text>
    <text x="20" y="125" fill="#71717a" font-size="9">Zero-lag Filter</text>
  </g>

  <!-- Stage 3 Node: Gemini 3.8 Reasoning -->
  <g transform="translate(560, 160)">
    <rect width="140" height="120" rx="10" fill="#0b1320" stroke="#3b82f6" stroke-width="1.5" filter="url(#neonBlur)"/>
    <circle cx="25" cy="30" r="6" fill="#3b82f6"/>
    <text x="40" y="34" fill="#ffffff" font-size="12" font-weight="bold">GEMINI 3.8</text>
    <text x="20" y="65" fill="#93c5fd" font-size="11">Deep Multimodal</text>
    <text x="20" y="85" fill="#a1a1aa" font-size="10">Truth Sentinel</text>
    <text x="20" y="105" fill="#60a5fa" font-size="9">Cross-turn Logic</text>
  </g>

  <!-- Stage 4 Node: HUD & Screen Share -->
  <g transform="translate(780, 160)">
    <rect width="120" height="120" rx="10" fill="#061812" stroke="#10b981" stroke-width="1.5" filter="url(#neonBlur)"/>
    <circle cx="25" cy="30" r="6" fill="#10b981"/>
    <text x="40" y="34" fill="#ffffff" font-size="12" font-weight="bold">PRESENT</text>
    <text x="20" y="65" fill="#6ee7b7" font-size="11">Live In Call</text>
    <text x="20" y="85" fill="#a1a1aa" font-size="10">Auto-Chat Post</text>
    <text x="20" y="105" fill="#10b981" font-size="9">Cloud Run Sync</text>
  </g>

  <!-- Bottom Diagnostic Telemetry -->
  <rect x="50" y="380" width="860" height="50" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1"/>
  <text x="70" y="410" fill="#71717a" font-size="11">MODEL: <tspan fill="#f59e0b">gemini-3.1-flash-image (Nano Banana 2)</tspan>  |  RESOLUTION: <tspan fill="#06b6d4">1024x1024 / SVG MESH</tspan>  |  ORCHESTRATION: <tspan fill="#10b981">CLOUD RUN AUTONOMOUS AGENT</tspan></text>
</svg>