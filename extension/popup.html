<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AEGIS Copilot Settings</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .header h1 {
      margin: 0;
      font-size: 14px;
      color: #06b6d4;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 12px 0;
      padding: 8px 10px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 8px;
      color: #34d399;
      font-weight: 600;
      font-size: 11px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      color: #94a3b8;
      font-size: 11px;
      margin-bottom: 4px;
      font-weight: 600;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      background: #000;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #fff;
      font-family: monospace;
      font-size: 11px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #06b6d4;
    }
    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0;
      color: #cbd5e1;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #06b6d4;
      color: #000;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
      margin-bottom: 8px;
    }
    .btn-primary:hover {
      background: #22d3ee;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    .footer {
      margin-top: 12px;
      font-size: 10px;
      color: #64748b;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 18px;">🛡️</span>
    <div>
      <h1>PROJECT A.E.G.I.S.</h1>
      <span style="font-size: 10px; color: #64748b;">Autonomous Meeting Copilot</span>
    </div>
  </div>

  <div class="status-pill">
    <span class="dot"></span>
    <span>Auto-Injects on meet.google.com</span>
  </div>

  <div class="field">
    <label>AEGIS Backend Host / Cloud Run URL:</label>
    <input type="text" id="server-host" value="localhost:8000" />
  </div>

  <label class="checkbox-field">
    <input type="checkbox" id="auto-chat" checked />
    <span>Auto-post contradiction questions to Google Meet chat</span>
  </label>

  <button class="btn btn-primary" id="save-btn">Save Settings</button>
  <button class="btn btn-secondary" id="open-hud-btn">Open Cinematic HUD</button>

  <div class="footer">
    ✨ Runs natively in any Google Meet tab.<br>Zero DevTools, zero console pasting.
  </div>

  <script src="popup.js"></script>
</body>
</html>
